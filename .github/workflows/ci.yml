name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # The `github.run_id` fallback puts every push-to-main run in a group of its
  # own, so a main run is never cancelled by a later one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # An OS-specific break should be visible on its own cell, not hidden by
      # whichever sibling happened to fail first.
      fail-fast: false
      matrix:
        # Bun is pinned for reproducible runs; OS coverage stays a matrix because
        # the native onnxruntime/tokenizer bindings are the part that differs.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # nothing here pushes; don't leave the token in .git/config
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # onnxruntime-node ships large native binaries; without this every cell
      # re-downloads them from the registry on each run.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      # unit tests only; the model-backed test skips itself when the weights are not on disk
      - run: bun run test
